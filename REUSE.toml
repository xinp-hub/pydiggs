# Licensing of every file in this repository, in the REUSE format (https://reuse.software,
# specification 3.3). Check it with `uvx --from "reuse[charset-normalizer]" reuse lint`;
# CI runs the same check (.github/workflows/reuse.yml).
#
# When several annotations match a file, the last one wins. The first is the default for
# pyDIGGS's own files, so a new file needs no header; the ones after it cover material
# vendored from elsewhere (see NOTICE and src/pydiggs/PROVENANCE.toml) and override any
# in-file notice. Licence texts are in LICENSES/.
version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2021-2026 Xin Peng and the pyDIGGS contributors"
SPDX-License-Identifier = "Apache-2.0"

# DIGGS XML schemas and deprecation registry (DIGGSml/schemas, DIGGSml/schema-dev).
[[annotations]]
path = ["src/pydiggs/schemas/**", "src/pydiggs/deprecation/DeprecationRegistry.*"]
precedence = "override"
SPDX-FileCopyrightText = "DIGGS"
SPDX-License-Identifier = "MPL-2.0"

# Energistics schemas profiled by DIGGS.
[[annotations]]
path = ["src/pydiggs/schemas/*/energistics/**", "src/pydiggs/schemas/*/witsml/2.0/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2014 Energistics", "2016 Energistics"]
SPDX-License-Identifier = "LicenseRef-Energistics-PLA"

# WITSML 1.3.1.1 schemas (POSC, the predecessor of Energistics).
[[annotations]]
path = "src/pydiggs/schemas/*/witsml/1.3.1.1/**"
precedence = "override"
SPDX-FileCopyrightText = "POSC"
SPDX-License-Identifier = "LicenseRef-POSC-LA"

# OGC GML 3.0 candidate XLink schema.
[[annotations]]
path = "src/pydiggs/schemas/**/xlinks.xsd"
precedence = "override"
SPDX-FileCopyrightText = "2001 OGC"
SPDX-License-Identifier = "LicenseRef-OGC-2001"

# DIGGS dictionaries (DIGGSml/def, MIT according to its README; see dictionaries/NOTICE).
[[annotations]]
path = [
  "src/pydiggs/dictionaries/codes/**",
  "src/pydiggs/dictionaries/properties.xml",
  "src/pydiggs/dictionaries/DiggsUomDictionary.xml",
  "src/pydiggs/crs/lrm.xml",
]
precedence = "override"
SPDX-FileCopyrightText = "The DIGGS project (DIGGSml/def)"
SPDX-License-Identifier = "MIT"

# Maintained in pyDIGGS, started from DIGGSml/def docs/validation/whiteList.xml.
[[annotations]]
path = "src/pydiggs/dictionaries/whiteList.xml"
precedence = "override"
SPDX-FileCopyrightText = [
  "2021-2026 Xin Peng and the pyDIGGS contributors",
  "The DIGGS project (DIGGSml/def)",
]
SPDX-License-Identifier = "Apache-2.0 AND MIT"

# Adapted from DIGGSml/validation, which states no licence.
[[annotations]]
path = "src/pydiggs/schematron/diggs_schematron_rules_2.6.sch"
precedence = "override"
SPDX-FileCopyrightText = [
  "2021-2026 Xin Peng and the pyDIGGS contributors",
  "The DIGGS project (DIGGSml/validation)",
]
SPDX-License-Identifier = "Apache-2.0 AND LicenseRef-DIGGS-Unstated"

# Facts extracted from the EPSG Dataset (IOGP).
[[annotations]]
path = "src/pydiggs/crs/epsg-subset.json"
precedence = "override"
SPDX-FileCopyrightText = "International Association of Oil & Gas Producers (IOGP)"
SPDX-License-Identifier = "LicenseRef-EPSG-TOU"

# Test fixtures: DIGGS examples (DIGGSml/diggs-examples) and the OASIS SARIF schema.
[[annotations]]
path = "tests/fixtures/official/**"
precedence = "override"
SPDX-FileCopyrightText = "DIGGS"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = ["tests/fixtures/official/PROVENANCE.toml", "tests/fixtures/official/PROVENANCE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2021-2026 Xin Peng and the pyDIGGS contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tests/fixtures/sarif/sarif-schema-2.1.0.json"
precedence = "override"
SPDX-FileCopyrightText = "2023 OASIS Open"
SPDX-License-Identifier = "LicenseRef-OASIS"
