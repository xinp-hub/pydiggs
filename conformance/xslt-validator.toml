# The DIGGSml XSLT validator, pinned for the cross-implementation agreement job.
#
# scripts/agreement.py runs it on every conformance corpus file and compares its verdict
# with pyDIGGS's (conformance/expected.toml); conformance/intended.toml says why they
# differ where they do. Same format as corpus.toml: each file is pinned by commit, size
# and sha256 (after CRLF -> LF normalisation) and fetched by
# `python scripts/agreement.py fetch` into .cache/agreement/. The files are never
# committed and never packaged: DIGGSml/validation states no licence.
#
# To move to a newer validator: change `commit`, update every sha256 and size (the
# GitHub API lists them: /repos/DIGGSml/validation/git/trees/<commit>?recursive=1 gives
# each blob's size; hash the fetched files), then `record` and review the diff of
# conformance/xslt-expected.toml and the agreement page.

[validator]
stylesheet = "validation/diggs-validation.xsl"
processor = "SaxonC-HE 12.7 (saxonche 12.7.0, conformance/xslt-requirements.txt): the Saxon release DIGGSml/validation ships (lib/saxon-he-12.7.jar)"

[sources.validation]
repo = "https://github.com/DIGGSml/validation"
commit = "68debbe74125b8dee7640c76e0b9b3f7ea698f94"
license = "None stated (LicenseRef-DIGGS-Unstated); fetched, never committed"
note = "The DIGGS project's semantic validator: the development repository, newest commit on main (2026-11-19). Its copy deployed under diggsml.org/def/validation (DIGGSml/def docs/validation) has not been updated since August 2026."

[sources.def]
repo = "https://github.com/DIGGSml/def"
commit = "2d76ba6c7affc94183659e21e4e2e90da5c84f2d"
license = "MIT (stated in the README; see src/pydiggs/dictionaries/NOTICE)"
note = "The commit pyDIGGS bundles its dictionaries from (src/pydiggs/PROVENANCE.toml); only what pyDIGGS does not bundle is listed here"

# URLs the validator reads, answered locally (scripts/agreement.py mirror_map). The DIGGS
# schemas and dictionaries pyDIGGS bundles are added from src/pydiggs/PROVENANCE.toml at
# the addresses diggsml.org publishes them. Every other URL is unreachable during a run.
[mirror]
# The validator loads its Schematron rules and SchXslt pipeline from its deployment when
# the relative path it tries first does not resolve; serve them from the pinned commit.
"https://diggsml.org/def/validation/modules/" = "cache:validation/modules/"
"https://diggsml.org/def/validation/definedCodeTypes.xml" = "cache:def/validation/definedCodeTypes.xml"
# The deprecation module reads the schema-dev registry first; pyDIGGS's bundled registry
# (DIGGSml/schemas, PROVENANCE.toml) stands in for it, so both sides read the same one.
"https://diggsml.org/schema-dev/deprecated/DeprecationRegistry.xml" = "package:deprecation/DeprecationRegistry.xml"
# Three corpus files name a schema on a GitHub branch instead of diggsml.org. The schema
# step only checks that the schema is there, is a DIGGS schema and has the file's
# namespace; it is answered with the pinned copy pyDIGGS bundles for that release.
"https://raw.githubusercontent.com/DIGGSml/diggs-schema/2.5.a/" = "package:schemas/diggs-schema-2.5.a/"
"https://raw.githubusercontent.com/DIGGSml/schema-dev/refs/heads/3.0/" = "package:schemas/diggs-schema-3.0.0/"
"https://raw.githubusercontent.com/DIGGSml/schema-dev/refs/heads/3.1-dev/" = "package:schemas/diggs-schema-3.1-dev/"

