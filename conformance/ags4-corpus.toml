# External AGS4 files in the pyDIGGS conformance corpus (the "ags4" set).
#
# Same manifest pattern as corpus.toml: each file is pinned by commit, sha256 (after
# CRLF -> LF normalisation) and size, and fetched on demand by
# `python scripts/conformance.py fetch --set ags4` into .cache/conformance/ags4/.
# External files are never committed and never packaged. The synthetic fixtures in
# tests/fixtures/ags4/ are part of the set too.
#
# What python-ags4 makes of every file is recorded in conformance/ags4-expected.toml by
# scripts/ags4_oracle.py (see conformance/README.md, "The AGS4 set").
#
# Licence rule (brief 20261111-pydiggs-conversion-core, Q1 and Q16): only files whose
# licence permits redistribution and use in CI, checked at the pinned commit. No AGS data
# dictionary and no AGS-published example file until AGS agrees in writing. Excluded
# candidates and the reasons are listed in conformance/README.md.

[sources.bgs]
repo = "https://github.com/BritishGeologicalSurvey/pyagsapi"
commit = "b223b48803d8feb07897ae468b455842cbf1790d"
license = "OGL-UK-3.0"
license_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
# README.md at the pinned commit, section "Example Files" (the repository's code is
# LGPL-3.0; the files under test/files/real are covered by this statement):
license_text = "Files in https://github.com/BritishGeologicalSurvey/pyagsapi/tree/main/test/files/real are a collection of real AGS files which have been submitted to the BGS and are available under OGL, we have included them here as example files for testing pyagsapi."
license_source = "https://github.com/BritishGeologicalSurvey/pyagsapi/blob/b223b48803d8feb07897ae468b455842cbf1790d/README.md#example-files"
attribution = "Contains public sector information licensed under the Open Government Licence v3.0. Contains British Geological Survey materials © UKRI."
note = "Real AGS4 submissions to the British Geological Survey (test/files/real). Fetch only: OGL v3.0 does not cover personal data, and these files may name people, so none is vendored and the oracle records digests, not cell values, for them."

