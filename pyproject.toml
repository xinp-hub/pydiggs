# FORGE conventions: PEP 621/639/735, hatchling, src/ layout, uv lockfile.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pydiggs"
dynamic = ["version"]
description = "Offline validation for DIGGS geotechnical XML instances (XSD, dictionary, Schematron)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "xin.peng", email = "xin_peng@outlook.com" }]
maintainers = [{ name = "xin.peng", email = "xin_peng@outlook.com" }]
keywords = ["DIGGS", "geotechnical", "XML", "validation", "schema"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "lxml>=5.3.0",
  "rich>=13.9.4",
]

[project.scripts]
pydiggs = "pydiggs.cli:main"

[project.urls]
Homepage = "https://github.com/xinp-hub/pydiggs"
Documentation = "https://xinp-hub.github.io/pydiggs/"
Source = "https://github.com/xinp-hub/pydiggs"
Issues = "https://github.com/xinp-hub/pydiggs/issues"
Changelog = "https://github.com/xinp-hub/pydiggs/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-randomly>=3.16",
  "hypothesis>=6.115",
  "mypy>=1.13",
  "ruff>=0.8",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "mkdocs-autorefs>=1.0",
  "myst-parser>=4.0.0",
]
audit = ["pip-audit>=2.7", "check-wheel-contents>=0.6", "twine>=6.0"]

[tool.hatch.version]
path = "src/pydiggs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydiggs"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "B", "C4", "D", "E", "F", "I", "N", "PERF", "PIE",
  "PL", "PTH", "RUF", "S", "SIM", "UP", "W",
]
ignore = [
  "ANN401",
  "PLR0913",
  "D100",
  "D104",
  "D105",
  "D107",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D", "PLR2004", "ARG", "SLF", "N801", "PLC0415", "E501"]
"src/pydiggs/dictionary.py" = ["ANN", "PLR0911", "PLR0912", "PLR0915", "E501", "D102", "D103", "D101"]
"src/pydiggs/semantic.py" = ["ANN", "E501", "D102", "D103", "D101"]
"src/pydiggs/units.py" = ["ANN", "D"]
"src/pydiggs/detect.py" = ["ANN", "D"]
"src/pydiggs/cli.py" = ["ANN", "T20", "D"]
"src/pydiggs/pydiggs.py" = ["N801", "T20", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "ANN", "E501", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
pretty = true
show_error_codes = true
files = ["src"]
# Legacy validation modules are gradually typed; gate on clean package surface first.
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
xfail_strict = true
filterwarnings = [
  "error",
  # lxml ISO Schematron emits ResourceWarnings for temporary XSLT files on some platforms.
  "ignore::ResourceWarning",
]
markers = [
  "slow: excluded from the fast feedback loop",
  "network: requires network access",
]

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
