# AGS4 to DIGGS mapping table: where each AGS4 group and heading goes in DIGGS.
#
# Data, not code: a mapping change is a small diff here, reviewed like any other. The format
# is described by convert-mapping-1.schema.json; docs/convert-mapping.md is generated from
# this file by scripts/mapping_doc.py (a test fails when it is stale).
#
# The table holds only AGS4 group and heading identifiers, key lists and parent groups. It
# copies nothing else from the AGS4 data dictionary (no descriptions, examples or notes).
#
# Every group is `draft` until the owner reviews it; mapping table 1.0 is signed off with
# pyDIGGS 1.10.0. Until then the table is 0.x and may change where a heading goes.
#
# Heading targets (`to`):
#   key     identifies the record; becomes its gml:id (made a valid XML id) and gml:name
#   link    a key of the parent record, used to attach this record to it
#   field   a typed field the converter fills (`target` names it)
#   param   a simple DIGGS element, `target` = "<Element>/<child>"
#   column  a result column; `property` is a key of the bundled DIGGS property dictionary
#   format  AGS4 format information the converter reads; it is not data and is not written
#   none    not converted; `reason` says why, and each non-null value is reported

mapping_version = "0.1"
ags_versions = ["4.0.3", "4.0.4", "4.1", "4.1.1", "4.2"]
diggs_versions = ["3.0.0"]

[[group]]
name = "PROJ"
pattern = "project"
status = "draft"
keys = ["PROJ_ID"]
element = "Project"
heading = [
  { name = "PROJ_ID", to = "key", target = "gml:name" },
  { name = "PROJ_NAME", to = "field", target = "name" },
  { name = "PROJ_LOC", to = "field", target = "locality" },
  { name = "PROJ_CLNT", to = "none", reason = "a client is a business associate, which the preview writer does not write" },
  { name = "PROJ_CONT", to = "none", reason = "a contractor is a business associate, which the preview writer does not write" },
  { name = "PROJ_ENG", to = "none", reason = "an engineer is a business associate, which the preview writer does not write" },
  { name = "PROJ_MEMO", to = "field", target = "remark" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

[[group]]
name = "TRAN"
pattern = "transmission"
status = "draft"
keys = []
element = "DocumentInformation"
heading = [
  { name = "TRAN_ISNO", to = "none", reason = "DocumentInformation has no issue number" },
  { name = "TRAN_DATE", to = "field", target = "creation_date" },
  { name = "TRAN_PROD", to = "none", reason = "the producer is a business associate, which the preview writer does not write" },
  { name = "TRAN_STAT", to = "none", reason = "DocumentInformation has no issue status" },
  { name = "TRAN_DESC", to = "field", target = "description" },
  { name = "TRAN_AGS", to = "format", reason = "the AGS4 version of the source; it selects how the file is read" },
  { name = "TRAN_RECV", to = "none", reason = "the recipient is a business associate, which the preview writer does not write" },
  { name = "TRAN_DLIM", to = "format", reason = "the record link delimiter, an AGS4 format setting" },
  { name = "TRAN_RCON", to = "format", reason = "the concatenation character, an AGS4 format setting" },
  { name = "TRAN_REM", to = "none", reason = "DocumentInformation has no remark" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

