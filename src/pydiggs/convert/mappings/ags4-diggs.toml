  { name = "UNIT_UNIT", to = "format", reason = "units are mapped through units.toml, not converted" },
  { name = "UNIT_DESC", to = "format", reason = "units are mapped through units.toml, not converted" },
  { name = "UNIT_REM", to = "format", reason = "units are mapped through units.toml, not converted" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
