[[group]]
name = "CPTT"
pattern = "test-table"
status = "reviewed"
parent = "CPTG"
keys = ["LOCA_ID", "CPTG_TESN", "CPTT_REDN"]
element = "Test"
# Each row is one row of the test's result table, at the depth CPTT_DPTH gives.
heading = [
  { name = "LOCA_ID", to = "link", target = "Test" },
  { name = "CPTG_TESN", to = "link", target = "Test" },
  { name = "CPTT_REDN", to = "none", reason = "a reading number is not held: the readings are ordered by depth (DIGGS to AGS4 numbers them 1, 2, 3 ...)" },
  { name = "CPTT_DPTH", to = "field", target = "index.position" },
  { name = "CPTT_QC", to = "column", property = "tip_resistance" },
  { name = "CPTT_FS", to = "column", property = "sleeve_friction" },
  { name = "CPTT_U1", to = "column", property = "pore_pressure_u1" },
  { name = "CPTT_U2", to = "column", property = "pore_pressure_u2" },
  { name = "CPTT_U3", to = "column", property = "pore_pressure_u3" },
  { name = "CPTT_QT", to = "column", property = "tip_resistance_corrected" },
  { name = "CPTT_PLEN", to = "none", reason = "the penetration length; the readings are indexed by depth (the PLEN index is a candidate for a later table)" },
  { name = "CPTT_INCX", to = "column", property = "inclination_x" },
  { name = "CPTT_INCY", to = "column", property = "inclination_y" },
  { name = "CPTT_TIME", to = "none", reason = "a clock time; the converter writes result columns as numbers" },
  { name = "CPTT_DUR", to = "column", property = "elapsed_time" },
  { name = "CPTT_TF", to = "none", reason = "the total thrust has no DIGGS 3.0.0 property" },
  { name = "CPTT_RF", to = "column", property = "friction_ratio" },
  { name = "CPTT_BDEN", to = "none", reason = "an assumed bulk density used in the derived values; no DIGGS property for this reading" },
  { name = "CPTT_CPO", to = "none", reason = "an in situ stress used in the derived values; no DIGGS property for this reading" },
  { name = "CPTT_ISPP", to = "none", reason = "an in situ pore pressure used in the derived values; no DIGGS property for this reading" },
  { name = "CPTT_CPOD", to = "none", reason = "an in situ stress used in the derived values; no DIGGS property for this reading" },
  { name = "CPTT_FT", to = "none", reason = "a value derived from the readings; the bundled DIGGS 3.0.0 property dictionary has no property for it" },
  { name = "CPTT_QNET", to = "none", reason = "a value derived from the readings; the bundled DIGGS 3.0.0 property dictionary has no property for it" },
