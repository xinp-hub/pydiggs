keys = ["LOCA_ID"]
heading = [
  { name = "LOCA_ID", to = "key", target = "gml:name" },
  { name = "LOCA_TYPE", to = "field", target = "element" },
  { name = "LOCA_STAT", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "LOCA_NATE", to = "field", target = "location.x" },
  { name = "LOCA_NATN", to = "field", target = "location.y" },
  { name = "LOCA_GREF", to = "field", target = "location.crs" },
  { name = "LOCA_GL", to = "field", target = "location.z" },
  { name = "LOCA_REM", to = "field", target = "remark" },
  { name = "LOCA_FDEP", to = "field", target = "total_depth" },
  { name = "LOCA_STAR", to = "field", target = "when_constructed.start" },
  { name = "LOCA_PURP", to = "none", reason = "boreholePurpose is a code list; AGS4 gives free text" },
  { name = "LOCA_TERM", to = "none", reason = "no DIGGS 3.0.0 target for the reason a hole was ended" },
  { name = "LOCA_ENDD", to = "field", target = "when_constructed.end" },
  { name = "LOCA_LETT", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "LOCA_LOCX", to = "none", reason = "local site coordinates need a local CRS, not in the preview mapping" },
  { name = "LOCA_LOCY", to = "none", reason = "local site coordinates need a local CRS, not in the preview mapping" },
  { name = "LOCA_LOCZ", to = "none", reason = "local site coordinates need a local CRS, not in the preview mapping" },
  { name = "LOCA_LREF", to = "none", reason = "local site coordinates need a local CRS, not in the preview mapping" },
  { name = "LOCA_DATM", to = "none", reason = "a separate vertical datum is not in the preview mapping" },
  { name = "LOCA_ETRV", to = "none", reason = "traverse end coordinates are not in the preview mapping" },
  { name = "LOCA_NTRV", to = "none", reason = "traverse end coordinates are not in the preview mapping" },
  { name = "LOCA_LTRV", to = "none", reason = "traverse end coordinates are not in the preview mapping" },
  { name = "LOCA_XTRL", to = "none", reason = "traverse end coordinates are not in the preview mapping" },
  { name = "LOCA_YTRL", to = "none", reason = "traverse end coordinates are not in the preview mapping" },
  { name = "LOCA_ZTRL", to = "none", reason = "traverse end coordinates are not in the preview mapping" },
  { name = "LOCA_LAT", to = "field", target = "location.lat" },
  { name = "LOCA_LON", to = "field", target = "location.lon" },
  { name = "LOCA_ELAT", to = "none", reason = "traverse end coordinates are not in the preview mapping" },
  { name = "LOCA_ELON", to = "none", reason = "traverse end coordinates are not in the preview mapping" },
  { name = "LOCA_LLZ", to = "field", target = "location.datum" },
  { name = "LOCA_LOCM", to = "none", reason = "no DIGGS 3.0.0 target for how a location was found" },
  { name = "LOCA_LOCA", to = "none", reason = "a grouping of locations by site sub-division (a tag, often a code in ABBR), not a description of the location" },
  { name = "LOCA_CLST", to = "none", reason = "a grouping of locations, typically by investigation phase; DIGGS 3.0.0 has no target for it" },
  { name = "LOCA_ALID", to = "none", reason = "alignments are not in the preview mapping" },
  { name = "LOCA_OFFS", to = "none", reason = "alignments are not in the preview mapping" },
  { name = "LOCA_CNGE", to = "none", reason = "alignments are not in the preview mapping" },
  { name = "LOCA_TRAN", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "LOCA_NATD", to = "field", target = "location.vertical_datum" },
  { name = "LOCA_ORID", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "LOCA_ORJO", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "LOCA_ORCO", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "LOCA_GLDT", to = "none", reason = "DIGGS 3.0.0 has no date for a ground level" },
  { name = "LOCA_VSSL", to = "none", reason = "a survey vessel has no DIGGS 3.0.0 target" },
  { name = "LOCA_NSRI", to = "field", target = "location.crs" },
  { name = "LOCA_LSRI", to = "none", reason = "local site coordinates need a local CRS, which the converter does not write" },
  { name = "LOCA_LLSI", to = "field", target = "location.datum" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

[[group]]
name = "GEOL"
pattern = "interval-observation"
status = "reviewed"
