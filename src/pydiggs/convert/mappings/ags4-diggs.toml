  { name = "SAMP_DTIM", to = "field", target = "date" },
  { name = "SAMP_UBLO", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_CONT", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_PREP", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_SDIA", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_WDEP", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_RECV", to = "param", target = "SamplingActivity/totalSampleRecovery", quantity = "Dimensionless" },
  { name = "SAMP_TECH", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_MATX", to = "none", reason = "sampleMatrix is a code list; not in the preview mapping" },
  { name = "SAMP_TYPC", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_WHO", to = "none", reason = "a person is a business associate, which the preview writer does not write" },
  { name = "SAMP_WHY", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_REM", to = "field", target = "remark" },
  { name = "SAMP_DESC", to = "field", target = "description" },
  { name = "SAMP_DESD", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_LOG", to = "none", reason = "a person is a business associate, which the preview writer does not write" },
  { name = "SAMP_COND", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_CLSS", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_BAR", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_TEMP", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_PRES", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_FLOW", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_ETIM", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_DURN", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_CAPT", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "SAMP_LINK", to = "none", reason = "record links are not in the preview mapping" },
  { name = "SAMP_RECL", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "GEOL_STAT", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
