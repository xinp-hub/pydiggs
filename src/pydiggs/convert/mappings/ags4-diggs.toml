[[group]]
name = "ISPT"
pattern = "test-per-row"
status = "reviewed"
parent = "LOCA"
keys = ["LOCA_ID", "ISPT_TOP"]
element = "Test"
procedure = "DrivenPenetrationTest"
procedure_params = { penetrationTestType = "SPT" }
heading = [
  { name = "LOCA_ID", to = "link", target = "samplingFeatureRef" },
  { name = "ISPT_TOP", to = "field", target = "location" },
  { name = "ISPT_SEAT", to = "none", reason = "seating drive blows are not in the preview mapping" },
  { name = "ISPT_MAIN", to = "none", reason = "main drive blows are not in the preview mapping (the N value is)" },
  { name = "ISPT_NPEN", to = "param", target = "DrivenPenetrationTest/totalPenetration", quantity = "Length" },
  { name = "ISPT_NVAL", to = "column", property = "n_value" },
  { name = "ISPT_N60", to = "column", property = "n60" },
  { name = "ISPT_REP", to = "none", reason = "the reported result text has no DIGGS property" },
  { name = "ISPT_CAS", to = "param", target = "DrivenPenetrationTest/depthCasing", quantity = "Length" },
  { name = "ISPT_WAT", to = "param", target = "DrivenPenetrationTest/waterDepth", quantity = "Length" },
  { name = "ISPT_TYPE", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "ISPT_HAM", to = "none", reason = "hammer identifiers are not in the preview mapping" },
  { name = "ISPT_ERAT", to = "param", target = "DrivenPenetrationTest/hammerEfficiency", quantity = "Dimensionless" },
  { name = "ISPT_INC1", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_INC2", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_INC3", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_INC4", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_INC5", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_INC6", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_PEN1", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_PEN2", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_PEN3", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_PEN4", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_PEN5", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_PEN6", to = "none", reason = "drive sets are not in the preview mapping" },
  { name = "ISPT_ROCK", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "ISPT_SWP", to = "param", target = "DrivenPenetrationTest/selfWeightPenetration", quantity = "Length" },
  { name = "ISPT_REM", to = "field", target = "remark" },
  { name = "ISPT_ENV", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "ISPT_METH", to = "none", reason = "test method text is not in the preview mapping" },
  { name = "ISPT_CRED", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "TEST_STAT", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
