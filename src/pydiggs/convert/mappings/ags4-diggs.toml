# AGS4 to DIGGS mapping table: where each AGS4 group and heading goes in DIGGS.
#
# Data, not code: a mapping change is a small diff here, reviewed like any other. The format
# is described by convert-mapping-1.schema.json; docs/convert-mapping.md is generated from
# this file by scripts/mapping_doc.py (a test fails when it is stale).
#
# The table holds only AGS4 group and heading identifiers, key lists and parent groups. It
# copies nothing else from the AGS4 data dictionary (no descriptions, examples or notes).
#
# Mapping table 1.0 (pyDIGGS 1.10.0). A group's `status` is `draft` until the owner has
# reviewed its rows, and `reviewed` after: every group of table 1.0 was reviewed against
# the AGS4 4.1.1 and 4.2 dictionaries and DIGGS 3.0.0 (owner review, 2026-11-13). Changing
# where an existing heading goes is a major version of the table; adding groups, headings
# or codes is a minor.
#
# One table drives both directions. A heading's `direction` (both, to-diggs, to-ags4)
# says which way it is used; DIGGS to AGS4 writes each heading from the DIGGS value it is
# read into here. A group's `to_ags4_versions` lists the AGS4 versions it is written for
# (all of them when absent), so that SCPG/SCPT are written for 4.1.1 and CPTG/CPTT, which
# replace them in 4.2, for 4.2.
#
# Heading targets (`to`):
#   key     identifies the record; becomes its gml:id (made a valid XML id) and gml:name
#   link    a key of the parent record, used to attach this record to it
#   field   a typed field the converter fills (`target` names it)
#   param   a simple DIGGS element, `target` = "<Element>/<child>"; a measure also gives its
#           `quantity` (the element is a diggs:<quantity>MeasureType), and is written only
#           with a unit that DIGGS 3.0.0 allows for that measure
#   column  a result column; `property` is a key of the bundled DIGGS property dictionary
#   format  AGS4 format information the converter reads; it is not data and is not written
#   none    not converted; `reason` says why, and each non-null value is reported
#
# Group patterns: project, transmission, lookup, feature, feature-component (a record
# held by a feature: hole diameter, casing, backfill, water strike; `element` and `role`
# name it, `holder` and `holder_role` the record that holds it where there is one),
# interval-observation, sample, test-per-row, and test-table (a general group and its
# data group, joined by key: GRAG with GRAT, or a cone test with its readings).

mapping_version = "1.0"
ags_versions = ["4.0.3", "4.0.4", "4.1", "4.1.1", "4.2"]
diggs_versions = ["3.0.0"]

[[group]]
name = "PROJ"
pattern = "project"
status = "reviewed"
keys = ["PROJ_ID"]
element = "Project"
heading = [
  { name = "PROJ_ID", to = "key", target = "gml:name" },
  { name = "PROJ_NAME", to = "field", target = "name" },
  { name = "PROJ_LOC", to = "field", target = "locality" },
  { name = "PROJ_CLNT", to = "none", reason = "a client is a business associate, which the preview writer does not write" },
  { name = "PROJ_CONT", to = "none", reason = "a contractor is a business associate, which the preview writer does not write" },
  { name = "PROJ_ENG", to = "none", reason = "an engineer is a business associate, which the preview writer does not write" },
  { name = "PROJ_MEMO", to = "field", target = "remark" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

[[group]]
name = "TRAN"
pattern = "transmission"
status = "reviewed"
keys = []
element = "DocumentInformation"
heading = [
  { name = "TRAN_ISNO", to = "none", reason = "DocumentInformation has no issue number" },
  { name = "TRAN_DATE", to = "field", target = "creation_date" },
  { name = "TRAN_PROD", to = "none", reason = "the producer is a business associate, which the preview writer does not write" },
  { name = "TRAN_STAT", to = "none", reason = "DocumentInformation has no issue status" },
  { name = "TRAN_DESC", to = "field", target = "description" },
  { name = "TRAN_AGS", to = "format", reason = "the AGS4 version of the source; it selects how the file is read" },
  { name = "TRAN_RECV", to = "none", reason = "the recipient is a business associate, which the preview writer does not write" },
  { name = "TRAN_DLIM", to = "format", reason = "the record link delimiter, an AGS4 format setting" },
  { name = "TRAN_RCON", to = "format", reason = "the concatenation character, an AGS4 format setting" },
  { name = "TRAN_REM", to = "none", reason = "DocumentInformation has no remark" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

[[group]]
name = "ABBR"
pattern = "lookup"
status = "reviewed"
keys = ["ABBR_HDNG", "ABBR_CODE"]
heading = [
  { name = "ABBR_HDNG", to = "format", reason = "abbreviation lists are read by the converter, not converted" },
  { name = "ABBR_CODE", to = "format", reason = "abbreviation lists are read by the converter, not converted" },
  { name = "ABBR_DESC", to = "format", reason = "abbreviation lists are read by the converter, not converted" },
  { name = "ABBR_LIST", to = "format", reason = "abbreviation lists are read by the converter, not converted" },
  { name = "ABBR_REM", to = "format", reason = "abbreviation lists are read by the converter, not converted" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

[[group]]
name = "UNIT"
pattern = "lookup"
status = "reviewed"
keys = ["UNIT_UNIT"]
heading = [
  { name = "UNIT_UNIT", to = "format", reason = "units are mapped through units.toml, not converted" },
  { name = "UNIT_DESC", to = "format", reason = "units are mapped through units.toml, not converted" },
  { name = "UNIT_REM", to = "format", reason = "units are mapped through units.toml, not converted" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

[[group]]
name = "TYPE"
pattern = "lookup"
status = "reviewed"
keys = ["TYPE_TYPE"]
heading = [
  { name = "TYPE_TYPE", to = "format", reason = "data types are AGS4 format information" },
  { name = "TYPE_DESC", to = "format", reason = "data types are AGS4 format information" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

[[group]]
name = "DICT"
pattern = "lookup"
status = "reviewed"
keys = ["DICT_TYPE", "DICT_GRP", "DICT_HDNG"]
heading = [
  { name = "DICT_TYPE", to = "format", reason = "the file's dictionary; user-defined groups and headings are reported, never interpreted" },
  { name = "DICT_GRP", to = "format", reason = "the file's dictionary; user-defined groups and headings are reported, never interpreted" },
  { name = "DICT_HDNG", to = "format", reason = "the file's dictionary; user-defined groups and headings are reported, never interpreted" },
  { name = "DICT_STAT", to = "format", reason = "the file's dictionary; user-defined groups and headings are reported, never interpreted" },
  { name = "DICT_DTYP", to = "format", reason = "the file's dictionary; user-defined groups and headings are reported, never interpreted" },
  { name = "DICT_DESC", to = "format", reason = "the file's dictionary; user-defined groups and headings are reported, never interpreted" },
  { name = "DICT_UNIT", to = "format", reason = "the file's dictionary; user-defined groups and headings are reported, never interpreted" },
  { name = "DICT_EXMP", to = "format", reason = "the file's dictionary; user-defined groups and headings are reported, never interpreted" },
  { name = "DICT_PGRP", to = "format", reason = "the file's dictionary; user-defined groups and headings are reported, never interpreted" },
  { name = "DICT_REM", to = "format", reason = "the file's dictionary; user-defined groups and headings are reported, never interpreted" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

[[group]]
