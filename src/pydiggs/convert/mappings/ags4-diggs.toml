heading = [
  { name = "LOCA_ID", to = "link", target = "samplingFeatureRef" },
  { name = "GEOL_TOP", to = "field", target = "interval.top" },
  { name = "GEOL_BASE", to = "field", target = "interval.base" },
  { name = "GEOL_DESC", to = "param", target = "Lithology/lithDescription" },
  { name = "GEOL_LEG", to = "param", target = "Lithology/legendCode" },
  { name = "GEOL_GEOL", to = "none", reason = "a project geology code; its meaning is in the file's ABBR group, not a unit name" },
  { name = "GEOL_GEO2", to = "none", reason = "a second geology code has no DIGGS 3.0.0 target in the preview mapping" },
  { name = "GEOL_STAT", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "GEOL_BGS", to = "none", reason = "a BGS Lexicon code needs a DIGGS code list, not in the preview mapping" },
  { name = "GEOL_FORM", to = "field", target = "geologic_unit" },
  { name = "GEOL_BNDF", to = "none", reason = "the base boundary definition is not in the mapping (DIGGS baseBoundary is a candidate for a later table)" },
  { name = "GEOL_REM", to = "field", target = "remark" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

