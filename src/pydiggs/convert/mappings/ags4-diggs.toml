  { name = "SPEC_DPTH", to = "field", target = "location" },
  { name = "SPEC_DESC", to = "field", target = "description" },
  { name = "SPEC_PREP", to = "none", reason = "specimen preparation text is not in the preview mapping" },
  { name = "GRAG_UC", to = "column", property = "coef_uniformity" },
  { name = "GRAG_VCRE", to = "column", property = "percent_cobbles" },
  { name = "GRAG_GRAV", to = "column", property = "percent_gravel" },
  { name = "GRAG_SAND", to = "column", property = "percent_sand" },
  { name = "GRAG_SILT", to = "column", property = "percent_silt" },
  { name = "GRAG_CLAY", to = "column", property = "clay_percent_2_micron" },
  { name = "GRAG_FINE", to = "column", property = "percent_fines" },
  { name = "GRAG_METH", to = "none", reason = "test method text is not in the preview mapping" },
  { name = "GRAG_LAB", to = "none", reason = "a laboratory is a business associate, which the preview writer does not write" },
  { name = "GRAG_CRED", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "GRAG_REM", to = "field", target = "remark" },
  { name = "GRAG_DEV", to = "none", reason = "deviations from the method are not in the preview mapping" },
  { name = "TEST_STAT", to = "none", reason = "no DIGGS 3.0.0 target in the preview mapping" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]

[[group]]
name = "GRAT"
pattern = "test-table"
status = "draft"
parent = "GRAG"
keys = ["LOCA_ID", "SAMP_TOP", "SAMP_REF", "SAMP_TYPE", "SAMP_ID", "SPEC_REF", "SPEC_DPTH", "GRAT_SIZE"]
element = "Grading"
# GRAT_TYPE selects the method through codes.toml: sieve rows become Grading readings of a
# SieveAnalysis, hydrometer rows Sedimentation readings of a Hydrometer analysis (where
# GRAT_SIZE is written as particleDiameter). Other methods are reported, not converted.
heading = [
  { name = "LOCA_ID", to = "link", target = "Test" },
  { name = "SAMP_TOP", to = "link", target = "Test" },
  { name = "SAMP_REF", to = "link", target = "Test" },
  { name = "SAMP_TYPE", to = "link", target = "Test" },
  { name = "SAMP_ID", to = "link", target = "Test" },
  { name = "SPEC_REF", to = "link", target = "Test" },
  { name = "SPEC_DPTH", to = "link", target = "Test" },
  { name = "GRAT_SIZE", to = "param", target = "Grading/particleSize" },
  { name = "GRAT_PERP", to = "param", target = "Grading/percentPassing" },
  { name = "GRAT_TYPE", to = "field", target = "method" },
  { name = "GRAT_REM", to = "field", target = "remark" },
  { name = "FILE_FSET", to = "none", reason = "files named in the FILE group are never opened or converted" },
]
