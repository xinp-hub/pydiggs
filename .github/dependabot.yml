version: 2
updates:
  # Actions are the highest-risk dependency in a publishing repo: a compromised
  # action runs with your OIDC identity. Keep them current and SHA-pinned.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait the FORGE-standard 14 days before proposing a new release. A compromised
    # version is usually yanked within days — that is the window where a mechanical bump
    # is most dangerous.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # The Pyodide the browser smoke tests against (tests/pyodide). A bump must move
  # pyodide-facts.json and the browser example with it, so it gets its own PR and the
  # FORGE-standard 14-day cooldown.
  - package-ecosystem: npm
    directory: /tests/pyodide
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: "test"
    groups:
      pyodide:
        patterns: ["*"]

  # The build tools of the npm package (js/). It has no runtime dependencies, so these
  # are development tools only; they still build what is published, so they wait out
  # the FORGE-standard 14-day cooldown.
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    groups:
      js-build-tools:
        patterns: ["*"]

  # The browser test of the npm package (js/e2e): Vite and Playwright. They decide which
  # browsers the package is tested in, so they wait out the same cooldown.
  - package-ecosystem: npm
    directory: /js/e2e
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: "test"
    groups:
      js-browser-tests:
        patterns: ["*"]

  # The container image's two bases (Dockerfile), pinned by digest: the uv builder and
  # the python:3.14-slim-trixie runtime. They must move to the same Python patch release,
  # so they share one group and one PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    groups:
      container-bases:
        patterns: ["*"]

  # The images that build the release container (.github/builder-images/Dockerfile,
  # read by publish.yml): binfmt, BuildKit and the SBOM scanner. They build and attest
  # what ships, so each bump waits out the cooldown and gets its own reviewed PR.
  - package-ecosystem: docker
    directory: /.github/builder-images
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
      runtime-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
    # Runtime majors get their own PR: they may require a compatibility change.

  # The dev container (.devcontainer/): its two images, pinned by digest, its features
  # (devcontainer-lock.json). Code runs in it with your GitHub token, so it gets the same
  # 14-day cooldown.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    groups:
      devcontainer-images:
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    groups:
      devcontainer-features:
        patterns: ["*"]

