# Generated by FORGE. Decides which pull requests merge without a human (AGENTS.md §2, HG4).
#
#   Tier 0  Dependabot patch/minor of Python deps from PyPI     -> App approves + auto-merge
#   Tier 1  small allowlisted change, agent review approves     -> App approves + auto-merge
#   Tier 2  everything else, every Actions bump included        -> a human approves and merges
#
# The tier is computed by .github/scripts/merge_policy.py from the diff, never by an agent.
# What makes it binding:
#   1. pull_request_target runs this file and both scripts from the base branch, so a pull
#      request cannot rewrite the policy that judges it. The PR's files are checked out as
#      data and never installed, imported, built or run.
#   2. The merge App's private key lives in the `automerge` environment, whose deployment
#      branch policy admits only the default branch. A workflow pushed to any other branch
#      cannot read it.
#   3. Branch protection: one approval, dismissed on every push, the last push approved by
#      someone other than its pusher, and the `merge policy` status required. The App
#      approves only the exact commit it judged, re-checks the head afterwards, and
#      withdraws its approvals and auto-merge whenever a later run is not eligible.
#   4. Only people (and this App) can approve: agents open PRs, they never review them.
#
# Setup (once per repository): the github-ci-cd skill, "Auto-merge by risk tier".
name: Merge policy

on:
  # Deliberate, see the header: base-branch code only, and the PR head is never executed.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [master]
    types:
      [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions: {}

concurrency:
  group: merge-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  STATUS_CONTEXT: merge policy
# The policy, the scripts and the base of every diff are github.sha: under pull_request_target
# that is the base branch's tip, the very commit this workflow file was loaded from. The
# payload's pull_request.base.sha is only the base recorded at the PR's last push, and can
# predate the policy itself.

jobs:
  classify:
    name: risk tier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out base and head
      pull-requests: read # list commits; Dependabot metadata
      statuses: write # mark `merge policy` pending on the head until a decision lands
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - name: Mark the decision pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state=pending
          -f context="$STATUS_CONTEXT" -f description="Deciding the risk tier"
      - name: Check out the base branch (the policy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          path: base
          persist-credentials: false
      - name: Check out the pull request (data only, never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: List the pull request's commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          gh api --paginate "repos/$GH_REPO/pulls/$PR/commits"
          --jq '[.[] | {author: (.author.login // ""), committer: (.committer.login // "")}]'
          | jq -s 'add' > "$RUNNER_TEMP/commits.json"
      # Commit logins come from commit emails, which anyone can set. The activity log
      # records who GitHub authenticated for every push, force-push and branch creation.
      - name: List who pushed to the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: >-
          gh api -X GET --paginate "repos/$GH_REPO/activity"
          -f ref="refs/heads/$HEAD_REF" -f per_page=100
          --jq '[.[] | .actor.login // ""]'
          | jq -s 'add // []' > "$RUNNER_TEMP/pushers.json"
      - name: Dependabot metadata
        id: deps
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3
      - name: Save the dependency list
        if: steps.deps.outcome == 'success'
        env:
          DEPS: ${{ steps.deps.outputs.updated-dependencies-json }}
        run: printf '%s' "$DEPS" > "$RUNNER_TEMP/deps.json"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          enable-cache: false # the cache here would be the base branch's
      - name: Public API check (griffe reads source, it does not import it)
        id: api
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: head
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          # Compare with the merge base, the same point the policy diffs against.
          against=$(git merge-base "$BASE_SHA" HEAD)
          # --no-inspection: griffe never falls back to importing a module it cannot parse.
          if uvx --from griffe==2.4.1 griffe check pydiggs --search src --no-inspection \
              --against "$against" --format github; then
            echo "break=false" >> "$GITHUB_OUTPUT"
          else
            echo "break=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Classify
        id: tier
        working-directory: head
        env:
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          API_BREAK: ${{ steps.api.outputs.break }}
          AUTOMERGE_AUTHORS: ${{ vars.AUTOMERGE_AUTHORS }}
        run: |
          args=(classify --base "$BASE_SHA" --head "$HEAD_SHA"
                --commits-json "$RUNNER_TEMP/commits.json" --pushers-json "$RUNNER_TEMP/pushers.json")
          if [ -f "$RUNNER_TEMP/deps.json" ]; then args+=(--deps-json "$RUNNER_TEMP/deps.json"); fi
          if [ "$API_BREAK" = "true" ]; then args+=(--api-break); fi
          python3 ../base/.github/scripts/merge_policy.py "${args[@]}"

  review:
    name: agent review
    needs: classify
    if: needs.classify.outputs.tier == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: automerge
    permissions:
      contents: read # check out base and head
    outputs:
      approved: ${{ steps.review.outputs.approved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Install the reviewer
        if: vars.AGENT_REVIEW_INSTALL != ''
        env:
          INSTALL: ${{ vars.AGENT_REVIEW_INSTALL }}
        run: bash -c "$INSTALL"
      - name: Review
        id: review
        working-directory: head
        env:
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGENT_REVIEW_COMMAND: ${{ vars.AGENT_REVIEW_COMMAND }}
          AGENT_REVIEW_KEY_ENV: ${{ vars.AGENT_REVIEW_KEY_ENV }}
          AGENT_REVIEW_API_KEY: ${{ secrets.AGENT_REVIEW_API_KEY }}
        run: >-
          python3 ../base/.github/scripts/agent_review.py
          --base "$BASE_SHA" --head "$HEAD_SHA" --rubric ../base/.github/agent-review.md

  decide:
    name: merge decision
    needs: [classify, review]
    # Not always(): a run superseded by a newer push must not touch what that run decides.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: automerge
    permissions: {} # everything here acts with the merge App's token
    outputs:
      outcome: ${{ steps.act.outputs.outcome }}
    steps:
      - name: Mint the merge app's token
        id: app
        if: vars.AUTOMERGE_APP_CLIENT_ID != ''
        # A missing key or uninstalled App means "no merge app", never "nobody can merge".
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3
        with:
          client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Approve the judged commit and enable auto-merge, or withdraw both
        id: act
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CLASSIFIED: ${{ needs.classify.result }}
          TIER: ${{ needs.classify.outputs.tier }}
          APPROVED: ${{ needs.review.outputs.approved }}
        run: |
          set -euo pipefail
          outcome() { echo "outcome=$1" >> "$GITHUB_OUTPUT"; }
          eligible=false
          if [ "$CLASSIFIED" = "success" ]; then
            case "$TIER" in
              0) eligible=true ;;
              1) if [ "$APPROVED" = "true" ]; then eligible=true; fi ;;
            esac
          fi
          if [ -z "${GH_TOKEN:-}" ] || [ -z "${APP_SLUG:-}" ]; then
            echo "::notice::No merge app token; Tier ${TIER:-?} waits for a human."
            outcome no-app
            exit 0
          fi
          current_head() { gh pr view "$PR" --json headRefOid --jq .headRefOid; }
          withdraw() {
            gh api --paginate "repos/$GH_REPO/pulls/$PR/reviews" \
              --jq ".[] | select(.user.login == \"$APP_SLUG[bot]\" and .state == \"APPROVED\") | .id" |
            while read -r id; do
              gh api -X PUT "repos/$GH_REPO/pulls/$PR/reviews/$id/dismissals" \
                -f message="Merge policy: no longer eligible ($1)" -f event=DISMISS > /dev/null
            done
            # gh prints an App as app/<slug>; GraphQL as <slug>. A human's auto-merge is theirs.
            by=$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest.enabledBy.login // ""')
            case "$by" in "$APP_SLUG" | "app/$APP_SLUG" | "$APP_SLUG[bot]") gh pr merge "$PR" --disable-auto ;; esac
          }
          # A re-run of an old run carries an old head. It must neither approve the new head
          # nor fight the run that is judging it.
          if [ "$(current_head)" != "$HEAD_SHA" ]; then
            echo "::notice::The head moved past $HEAD_SHA; the newer run decides."
            outcome stale
            exit 0
          fi
          if [ "$eligible" != "true" ]; then
            withdraw "Tier ${TIER:-unknown}"
            echo "### Tier ${TIER:-unknown}: waiting for a human (HG4)" >> "$GITHUB_STEP_SUMMARY"
            outcome human
            exit 0
          fi
          review_id=$(gh api "repos/$GH_REPO/pulls/$PR/reviews" -f commit_id="$HEAD_SHA" \
            -f event=APPROVE -f body="Merge policy: Tier $TIER (see the Merge policy run)." --jq .id)
          if [ "$(current_head)" != "$HEAD_SHA" ]; then
            gh api -X PUT "repos/$GH_REPO/pulls/$PR/reviews/$review_id/dismissals" \
              -f message="Merge policy: the head moved while approving" -f event=DISMISS > /dev/null
            outcome stale
            exit 0
          fi
          gh pr merge "$PR" --auto --squash --match-head-commit "$HEAD_SHA"
          echo "### Tier $TIER: approved $HEAD_SHA, auto-merge enabled" >> "$GITHUB_STEP_SUMMARY"
          outcome auto-merge

  # The required `merge policy` status is a "decision has landed" barrier, not the safety
  # gate (the App's approval is). It is posted here, with only github.token and no
  # environment, so any failure on the App path still leaves humans able to merge.
  publish:
    name: publish decision
    needs: [classify, decide]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write # the `merge policy` status on the judged commit
    steps:
      - name: Post the `merge policy` status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TIER: ${{ needs.classify.outputs.tier }}
          OUTCOME: ${{ needs.decide.outputs.outcome }}
          DECIDED: ${{ needs.decide.result }}
        run: |
          case "$OUTCOME" in
            auto-merge) text="Tier $TIER: approved, auto-merge enabled" ;;
            stale) text="Superseded by a newer commit" ;;
            *) text="Tier ${TIER:-?}: a human approves and merges (${OUTCOME:-$DECIDED})" ;;
          esac
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state=success \
            -f context="$STATUS_CONTEXT" -f description="${text:0:140}" > /dev/null
