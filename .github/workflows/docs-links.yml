# Adopted from FORGE 1.23.0 (templates/pkg). Checks the links that leave the documentation, once a week.
#
# Links between pages are checked on every build by `mkdocs build --strict`. A link to
# someone else's site breaks on their schedule, not on a commit here, so it is checked on a
# timer and never blocks a pull request. A dead link fails the run; GitHub then notifies
# whoever last changed this file's schedule.
name: Docs links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  links:
    name: external links
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group docs --group dev
      - name: Build the site
        run: uv run --group docs mkdocs build --strict
      # The site's own address and GitHub's edit pages (which ask for a login) are skipped.
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          fail: true
          failIfEmpty: true
          jobSummary: true
          args: >-
            --no-progress
            --max-retries 3
            --exclude '^https://xinp-hub\.github\.io/pydiggs/'
            --exclude '^https://github\.com/xinp-hub/pydiggs/edit/'
            'site/**/*.html' README.md
