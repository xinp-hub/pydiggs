# CI — uv + hatchling. Least privilege; Actions pinned via scripts/pin_actions.py.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"
  UV_FROZEN: "1"

jobs:
  # GitHub lists every commit author, committer and Co-authored-by identity as a
  # contributor, and removing one later needs a history rewrite (#224, #227).
  # Local FORGE git hooks strip AI-agent attribution; this is the server-side backstop for
  # commits that skipped them. The rules live in the repo-policy `attribution` action.
  ai-attribution:
    name: no AI contributors
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject commits that credit an AI agent
        uses: xinp-hub/repo-policy/attribution@f0855f43d6e937d37d5fb00b7fe3555cf3c8f09e # v1.1.0
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  lint:
    name: lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --all-groups --all-extras
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: mypy
        run: uv run mypy

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups --all-extras
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing -p no:randomly

  # Cross-OS failures are almost always paths, line endings or encodings: one job per OS
  # at a single Python catches them. The fast suite here; Linux runs the full one.
  test-os:
    name: test (${{ matrix.os }}, 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-groups --all-extras
      - name: pytest (fast suite)
        run: uv run pytest -q -m "not slow and not scaling" -p no:randomly --durations=25

  # The extras are optional: the core must import and validate without any of them,
  # and must not pull in rich, multiprocessing or an adapter on import.
  core-only:
    name: core without extras
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --no-dev
      - name: Import and validate with no extras installed
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          import pydiggs
          report = pydiggs.validate_bytes(b'<Diggs xmlns="http://diggsml.org/schemas/2.6"/>')
          assert report.verdict, report
          loaded = {"rich", "multiprocessing", "fastapi", "mcp"} & set(sys.modules)
          assert not loaded, loaded
          print(pydiggs.__version__, report.verdict)
          PY
      - name: A missing extra exits 2 and names it
        run: |
          set +e
          uv run --no-sync pydiggs serve --http 2> err.txt
          code=$?
          cat err.txt
          test "$code" -eq 2 && grep -q "pydiggs\[server\]" err.txt
      - name: A stdio session needs no extra (initialize, shutdown, exit)
        run: |
          uv run --no-sync python - <<'PY'
          import json, subprocess, sys
          proc = subprocess.Popen(
              [sys.executable, "-m", "pydiggs", "serve", "--stdio"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE,
          )
          def call(request):
              proc.stdin.write(json.dumps(request).encode() + b"\n")
              proc.stdin.flush()
              if "id" not in request:
                  return None
              reply = json.loads(proc.stdout.readline())
              print(reply)
              assert reply["id"] == request["id"] and "result" in reply, reply
              return reply["result"]
          init = {"protocol_version": "1.0"}
          result = call({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": init})
          assert result["protocol_version"] == "1.0"
          assert call({"jsonrpc": "2.0", "id": 2, "method": "shutdown"}) is None
          call({"jsonrpc": "2.0", "method": "exit"})
          assert proc.wait(timeout=60) == 0, proc.returncode
          PY

  build:
    name: build & inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          uv build
      - name: Check distributions
        run: |
          uv run --group audit twine check --strict dist/*
          uv run --group audit check-wheel-contents dist/*.whl
      - name: Smoke-import the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import pydiggs; print(pydiggs.__version__)"

  # The browser contract (brief D10): the built wheel installs into the pinned Pyodide
  # with deps=False and gives CPython's bytes. Goldens come from CPython in this job, from
  # the same checkout, so they never need committing or refreshing.
  pyodide:
    name: pyodide smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/pyodide/package-lock.json
      - name: Install the pinned Pyodide (no install scripts)
        working-directory: tests/pyodide
        run: npm ci --ignore-scripts
      - name: Build the wheel and the CPython goldens
        run: |
          uv build --wheel
          uv sync --no-dev
          uv run --no-sync python tests/pyodide/cases.py "$RUNNER_TEMP/goldens.json"
      - name: Smoke the wheel in Pyodide
        run: node tests/pyodide/smoke.mjs --wheel dist/pydiggs-*-py3-none-any.whl --goldens "$RUNNER_TEMP/goldens.json"
      # The npm package's worker (js/src/worker-core.ts), driven by the messages a page
      # sends, against the same Pyodide, wheel and goldens.
      - name: Smoke the npm package's worker in Pyodide
        run: node tests/pyodide/worker-smoke.mjs --wheel dist/pydiggs-*-py3-none-any.whl --goldens "$RUNNER_TEMP/goldens.json"
      # The npm package's Node side: PydiggsNode in a worker thread and the Fetch handler
      # serving pyDIGGS's HTTP API, against the same Pyodide, wheel and goldens.
      - name: Smoke the npm package's Node engine and HTTP handler in Pyodide
        run: node tests/pyodide/node-smoke.mjs --wheel dist/pydiggs-*-py3-none-any.whl --goldens "$RUNNER_TEMP/goldens.json"

  # The container image (docs/container.md), built from this checkout's wheel and uv.lock
  # for amd64 and loaded locally; nothing is pushed. It is run with the documented
  # hardened line and smoke-tested, then scanned: a fixable HIGH or CRITICAL fails.
  container-build:
    name: container build, smoke & scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: pydiggs:ci
      # Trivy is installed from its release, checked against the sha256 below (taken
      # from trivy_0.76.1_checksums.txt, whose Sigstore bundle verifies against the
      # aquasecurity/trivy reusable-release workflow). Bump both together.
      TRIVY_VERSION: "0.76.1"
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Build the wheel
        run: uv build --wheel
      - name: Build the image (linux/amd64, loaded, not pushed)
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg "REVISION=$REVISION" \
            --tag "$IMAGE" .
          docker image inspect "$IMAGE" --format 'user={{.Config.User}} size={{.Size}}'
      - name: Smoke-test with the hardened run line
        run: python3 .github/scripts/container_smoke.py "$IMAGE"
      - name: Install Trivy (checksum-verified)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version
      - name: Scan the image (fail on fixable HIGH/CRITICAL)
        run: |
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress "$IMAGE"

  # The frozen-sidecar guidance in docs/sidecar-hosts.md (brief D15): a PyInstaller
  # --onedir console build of tests/frozen/sidecar_main.py must serve a complete stdio
  # session on Linux and on Windows.
  sidecar-frozen:
    name: frozen sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --no-dev --group freeze
      - name: Freeze the sidecar (PyInstaller --onedir --console)
        run: |
          uv run --no-sync pyinstaller --onedir --console --noconfirm --name pydiggs \
            --collect-data pydiggs \
            --distpath "$RUNNER_TEMP/frozen/dist" --workpath "$RUNNER_TEMP/frozen/build" \
            --specpath "$RUNNER_TEMP/frozen" tests/frozen/sidecar_main.py
      - name: Drive initialize, validate, shutdown and exit
        run: |
          exe="$RUNNER_TEMP/frozen/dist/pydiggs/pydiggs"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          uv run --no-sync python .github/scripts/frozen_sidecar_smoke.py "$exe" \
            tests/test_files/2.6/Schema_Error_1-2_6.xml

  # The mcp extra has no upper bound and the server uses one private SDK attribute,
  # so this runs the MCP tests against the newest mcp new installs would get. Not in
  # all-green: a new mcp release should not block unrelated pull requests.
  mcp-newest:
    name: MCP tests on the newest mcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_FROZEN: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --all-groups --all-extras --upgrade-package mcp --upgrade-package mcp-types
      - run: uv pip list | grep -E '^mcp'
      - run: uv run --no-sync pytest -q -p no:randomly --no-cov tests/test_mcp_server.py

  # The conformance corpus (conformance/README.md): the vendored DIGGSml examples plus
  # external real-world files pinned by commit and sha256, each with an expected outcome.
  # The test jobs check the vendored files; this job also fetches and checks the others.
  conformance:
    name: conformance corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --no-dev
      - name: Fetch the external files (pinned commit, size and sha256 checked)
        run: uv run --no-sync python scripts/conformance.py fetch
      - name: Compare every corpus file with conformance/expected.toml
        run: uv run --no-sync python scripts/conformance.py check
      - name: Compare every corpus file with the reader census in conformance/model.toml
        run: uv run --no-sync python scripts/conformance.py check --model

  # The AGS4 reader's fuzz target (tests/test_ags4_hostile.py): random bytes, mixes of
  # AGS4 pieces and mutations of the fixtures must each give a File or one of the two
  # documented errors, and never anything else. The test jobs run it on a small budget;
  # this job runs it alone on a large one.
  ags4-fuzz:
    name: ags4 fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-groups --all-extras
      - name: Fuzz the AGS4 reader
        env:
          PYDIGGS_FUZZ_EXAMPLES: "20000"
        run: uv run --no-sync pytest -q -p no:randomly --no-cov tests/test_ags4_hostile.py

  # The npm package (js/): TypeScript types and clients for the contracts this repository
  # owns. Its types, pins and schema copies are generated from the JSON Schemas, the
  # OpenAPI document and the browser example, so a change to any of those fails the
  # first step here until `npm run generate` is run in js/ and committed.
  js:
    name: npm package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Generated files match the contracts (needs no dependencies)
        run: node scripts/generate.mjs --check
      - name: Install the build tools (no install scripts)
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check the packed tarball (publint, Are the Types Wrong)
        run: npm run lint:package

  # The site is deployed from master by docs.yml, which is too late to learn that a page
  # has a broken link. This builds it the same way on every pull request and publishes
  # nothing.
  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group docs --group dev
      - name: Build (strict, a broken link fails the build)
        run: uv run --group docs mkdocs build --strict

  all-green:
    name: all green
    if: always()
    needs: [lint, test, test-os, core-only, build, pyodide, container-build, sidecar-frozen, conformance, ags4-fuzz, js, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          if echo "$NEEDS" | grep -qE '"result": "(failure|cancelled)"'; then
            exit 1
          fi
