# CI — uv + hatchling. Least privilege; Actions pinned via scripts/pin_actions.py.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"
  UV_FROZEN: "1"

jobs:
  # GitHub lists every commit author, committer and Co-authored-by identity as a
  # contributor, and removing one later needs a history rewrite (Cursor Agent: #224, #227).
  # Local FORGE git hooks strip AI-agent attribution; this is the server-side backstop for
  # commits that skipped them. The rules are FORGE's adapters/ai_attribution.py, copied.
  ai-attribution:
    name: no AI contributors
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject commits that credit an AI agent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ai_attribution.py check "$BASE_SHA..$HEAD_SHA"

  lint:
    name: lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --all-groups
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: mypy
        run: uv run mypy

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing -p no:randomly

  # Cross-OS failures are almost always paths, line endings or encodings: one job per OS
  # at a single Python catches them. The fast suite here; Linux runs the full one.
  test-os:
    name: test (${{ matrix.os }}, 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-groups
      - name: pytest (fast suite)
        run: uv run pytest -q -m "not slow and not scaling" -p no:randomly --durations=25

  build:
    name: build & inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          uv build
      - name: Check distributions
        run: |
          uv run --group audit twine check --strict dist/*
          uv run --group audit check-wheel-contents dist/*.whl
      - name: Smoke-import the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import pydiggs; print(pydiggs.__version__)"

  all-green:
    name: all green
    if: always()
    needs: [lint, test, test-os, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          if echo "$NEEDS" | grep -qE '"result": "(failure|cancelled)"'; then
            exit 1
          fi
