# Releases the npm package in js/ with npm Trusted Publishing (OIDC) and staged
# publishing: no token, and nothing becomes installable until a maintainer approves the
# staged version on npm with two-factor authentication.
#
# Setup on npmjs.com and GitHub (0.1.0 was published by hand, before either existed):
#   - the package's trusted publisher is
#       owner: xinp-hub  repository: pydiggs  workflow: js-publish.yml  environment: npm
#     with neither "Allow npm publish" nor "Allow npm dist-tag" ticked, so this workflow
#     can only stage a version; it cannot publish one or move a tag;
#   - the GitHub Environment `npm` has required reviewers and deploys from js-v* tags only.
# npm drops a trusted publisher that has not published within two days of being created;
# if that happens, create it again with the same values before the next release.
#
# Release path: a signed tag js-vX.Y.Z -> verify -> check and pack -> GitHub reviewer ->
# staged on npm -> approved with 2FA (`npm stage approve <id>`, or the Staged Packages tab
# of the package on npmjs.com). A manual run stops after the pack; it never stages.
name: Release npm package

on:
  push:
    tags: ["js-v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: js-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: verify, check and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # As in publish.yml: the tag must be annotated and signed by a key listed in
      # .github/release-signers on the default branch, read from that branch and never
      # from the tagged commit.
      - name: Verify the tag is signed by a release key
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag; release tags must be signed (git tag -s)"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/heads/${DEFAULT_BRANCH}"
          signers="${RUNNER_TEMP}/release-signers"
          git show "FETCH_HEAD:.github/release-signers" > "${signers}"
          if ! git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="${signers}" \
              verify-tag "${TAG}"; then
            echo "::error::${TAG} is not signed by a key in .github/release-signers (git tag -s)"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - id: version
        name: Tag, package.json and CHANGELOG agree
        working-directory: js
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${EVENT}" = "push" ] && [ "${GITHUB_REF_NAME#js-v}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::js/CHANGELOG.md has no released section for ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Install the build tools (no install scripts)
        working-directory: js
        run: npm ci --ignore-scripts
      - name: Drift check, type check, tests, build, publint, attw
        working-directory: js
        run: npm run check
      - name: Pack
        working-directory: js
        run: |
          set -euo pipefail
          npm pack --ignore-scripts
          sha256sum ./*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-tarball
          path: js/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: stage on npm
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@pydiggs/client/v/${{ needs.build.outputs.version }}
    permissions:
      id-token: write  # the OIDC token npm exchanges for a short-lived staging credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-tarball
      # Node 26 ships an npm that knows staged publishing; the step below holds it to that.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
      - name: npm is new enough for staged publishing
        run: |
          set -euo pipefail
          required="11.15.0"
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "${required}" "${have}" | sort -V | head -n1)" != "${required}" ]; then
            echo "::error::npm ${have} is older than ${required}, which staged publishing needs"
            exit 1
          fi
      # The tarball was built and checked in the job above; nothing is installed or run here.
      # Staging publishes nothing: the version waits on npm for a maintainer's approval.
      - name: Stage the version for approval
        run: |
          set -euo pipefail
          npm stage publish ./*.tgz --access public
          echo "::notice::Staged. Approve it with 2FA: npm stage list @pydiggs/client, then npm stage approve <id>."
