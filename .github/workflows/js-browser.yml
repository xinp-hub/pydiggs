# Runs the npm package (js/) in real browsers: Chromium, Firefox and WebKit. A small Vite
# app (js/e2e) installs the packed tarball, as a vendor's app would, builds it, and is
# served under the Content Security Policy docs/browser.md documents. Playwright picks
# each Pyodide smoke fixture and compares the browser's findings and model with CPython's
# from this checkout.
#
# This is the only test of what a Web Worker alone can do: the integrity-checked fetch
# of Pyodide's loader from its CDN, the bundler's handling of the package's worker file,
# and the CSP. It downloads Pyodide and three browsers, so it runs when js/ changes,
# weekly, and on demand, and is not a required check.
name: npm package in browsers

on:
  pull_request:
    branches: [master]
    paths:
      - "js/**"
      - "tests/pyodide/fixtures/**"
      - "tests/pyodide/cases.py"
      - ".github/workflows/js-browser.yml"
  push:
    branches: [master]
    paths:
      - "js/**"
      - "tests/pyodide/fixtures/**"
      - "tests/pyodide/cases.py"
      - ".github/workflows/js-browser.yml"
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: js-browser-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browsers:
    name: real browsers (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            js/package-lock.json
            js/e2e/package-lock.json
      - name: Build the wheel and the CPython goldens
        run: |
          uv build --wheel
          uv sync --no-dev
          uv run --no-sync python tests/pyodide/cases.py "$RUNNER_TEMP/goldens.json"
      - name: Build and pack the npm package
        working-directory: js
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Install the packed package and this checkout's wheel into the test app
        working-directory: js/e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts "$RUNNER_TEMP"/pydiggs-client-*.tgz
          wheel="$(ls ../../dist/pydiggs-*-py3-none-any.whl | tail -n 1)"
          mkdir -p public/wheels
          cp "$wheel" public/wheels/
          echo "VITE_PYDIGGS_WHEEL=/wheels/$(basename "$wheel")" >> "$GITHUB_ENV"
      - name: Install the browsers
        working-directory: js/e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run in Chromium, Firefox and WebKit
        working-directory: js/e2e
        env:
          PYDIGGS_GOLDENS: ${{ runner.temp }}/goldens.json
        run: npx playwright test
      - name: Keep the report and traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            js/e2e/playwright-report
            js/e2e/test-results
          retention-days: 7
