# Runs the npm package (js/) where vendors run it: in real browsers and in a Next.js app.
#
# - package: builds this checkout's wheel, CPython's answers for the Pyodide smoke
#   fixtures (the goldens), and the packed npm tarball, once for every job below.
# - vite: a Vite app (js/e2e) installs the tarball. Its production build runs under the
#   CSP docs/browser.md documents in Chromium, Firefox and WebKit; the Vite dev server
#   runs in Chromium.
#   Then again cross-origin isolated (COOP and COEP), where a long request is interrupted
#   instead of costing a worker; and self-hosted: `pydiggs-client vendor` fills a folder,
#   and the CSP allows this origin only, so any file the folder lacks fails the test. The
#   offline recipe (a service worker using @pydiggs/client/sw) runs in Chromium.
# - nextjs: a Next.js app (js/e2e-next) installs the tarball and runs the browser worker
#   in a client component, built by Turbopack and by webpack and from `next dev`, and
#   PydiggsNode behind a route handler on the Node runtime.
# - runtimes: the Node smoke (tests/pyodide/node-smoke.mjs) under Bun and Deno.
#
# Every answer is compared with CPython's. These jobs download Pyodide, browsers and
# Next.js, so they run when js/ changes, weekly, and on demand, and are not required.
name: npm package in browsers

on:
  pull_request:
    branches: [master]
    paths:
      - "js/**"
      - "tests/pyodide/fixtures/**"
      - "tests/pyodide/cases.py"
      - "tests/pyodide/node-smoke.mjs"
      - ".github/workflows/js-browser.yml"
  push:
    branches: [master]
    paths:
      - "js/**"
      - "tests/pyodide/fixtures/**"
      - "tests/pyodide/cases.py"
      - "tests/pyodide/node-smoke.mjs"
      - ".github/workflows/js-browser.yml"
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: js-browser-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package:
    name: wheel, goldens and npm tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Build the wheel and the CPython goldens
        run: |
          set -euo pipefail
          uv build --wheel --out-dir "$RUNNER_TEMP/out"
          uv sync --no-dev
          uv run --no-sync python tests/pyodide/cases.py "$RUNNER_TEMP/out/goldens.json"
      - name: Build and pack the npm package
        working-directory: js
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: under-test
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 3

  vite:
    name: Vite (Chromium, Firefox, WebKit; dev server)
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: js/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/e2e/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: under-test
          path: ${{ runner.temp }}/out
      - name: Install the packed package and the wheel into the test app
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts "$RUNNER_TEMP"/out/pydiggs-client-*.tgz
          wheel="$(ls "$RUNNER_TEMP"/out/pydiggs-*-py3-none-any.whl | tail -n 1)"
          mkdir -p public/wheels
          cp "$wheel" public/wheels/
          echo "VITE_PYDIGGS_WHEEL=/wheels/$(basename "$wheel")" >> "$GITHUB_ENV"
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run
        env:
          PYDIGGS_GOLDENS: ${{ runner.temp }}/out/goldens.json
        run: npx playwright test
      # COOP and COEP: the worker shares an interrupt buffer with the page, and Pyodide,
      # lxml and the wheel still load from their CDNs under require-corp.
      - name: Run cross-origin isolated
        env:
          PYDIGGS_GOLDENS: ${{ runner.temp }}/out/goldens.json
          PYDIGGS_ISOLATED: "1"
        run: npx playwright test --project chromium --project firefox --project webkit
      - name: Vendor Pyodide and the wheel with pydiggs-client
        run: |
          set -euo pipefail
          wheel="$(ls "$RUNNER_TEMP"/out/pydiggs-*-py3-none-any.whl | tail -n 1)"
          npx pydiggs-client vendor public/pyodide --pydiggs-wheel "$wheel"
          echo "SELF_HOSTED_WHEEL=/pyodide/$(basename "$wheel")" >> "$GITHUB_ENV"
      - name: Run self-hosted, with no CDN allowed
        env:
          PYDIGGS_GOLDENS: ${{ runner.temp }}/out/goldens.json
          PYDIGGS_SELF_HOSTED: "1"
          VITE_PYODIDE_BASE: /pyodide/
        run: VITE_PYDIGGS_WHEEL="$SELF_HOSTED_WHEEL" npx playwright test --project chromium --project firefox --project webkit
      - name: Keep the report and traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-vite
          path: |
            js/e2e/playwright-report
            js/e2e/test-results
          retention-days: 7

  nextjs:
    name: Next.js (${{ matrix.name }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Turbopack build
            mode: build
            flags: ""
          - name: webpack build
            mode: build
            flags: "--webpack"
          - name: next dev
            mode: dev
            flags: ""
    defaults:
      run:
        working-directory: js/e2e-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/e2e-next/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: under-test
          path: ${{ runner.temp }}/out
      - name: Install the packed package and the wheel into the app
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts "$RUNNER_TEMP"/out/pydiggs-client-*.tgz
          wheel="$(ls "$RUNNER_TEMP"/out/pydiggs-*-py3-none-any.whl | tail -n 1)"
          mkdir -p public/wheels
          cp "$wheel" public/wheels/
          echo "NEXT_PUBLIC_PYDIGGS_WHEEL=/wheels/$(basename "$wheel")" >> "$GITHUB_ENV"
          echo "PYDIGGS_WHEEL_PATH=$wheel" >> "$GITHUB_ENV"
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Run
        env:
          PYDIGGS_GOLDENS: ${{ runner.temp }}/out/goldens.json
          NEXT_MODE: ${{ matrix.mode }}
          NEXT_BUILD_FLAGS: ${{ matrix.flags }}
        run: npx playwright test
      - name: Keep the report and traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-next-${{ matrix.mode }}-${{ strategy.job-index }}
          path: |
            js/e2e-next/playwright-report
            js/e2e-next/test-results
            js/e2e-next/.next/trace
          retention-days: 7

  runtimes:
    name: Node engine under ${{ matrix.runtime }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/pyodide/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2
        if: matrix.runtime == 'deno'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: under-test
          path: ${{ runner.temp }}/out
      - name: Install the pinned Pyodide (no install scripts)
        working-directory: tests/pyodide
        run: npm ci --ignore-scripts
      - name: The Node smoke under ${{ matrix.runtime }}
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          wheel="$(ls "$RUNNER_TEMP"/out/pydiggs-*-py3-none-any.whl | tail -n 1)"
          case "$RUNTIME" in
            bun) bun tests/pyodide/node-smoke.mjs --wheel "$wheel" --goldens "$RUNNER_TEMP/out/goldens.json" ;;
            deno) deno run --allow-all tests/pyodide/node-smoke.mjs --wheel "$wheel" --goldens "$RUNNER_TEMP/out/goldens.json" ;;
          esac
