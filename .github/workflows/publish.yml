# Trusted Publishing (OIDC) — no API token.
# Filename stays `publish.yml` so the existing PyPI pending/active publisher keeps working:
#   owner: xinp-hub  repo: pydiggs  workflow: publish.yml  environment: pypi
# Mirror that publisher on test.pypi.org with environment: testpypi.
# Add required reviewers on the GitHub `pypi` Environment (optional on `testpypi`).
#
# Release path (FORGE): guard → build → TestPyPI → smoke → PyPI → Sigstore + GitHub Release.
# `setup-uv` uses enable-cache: false on purpose (cache poisoning ↔ publish path).
#
# If the tag version is already on PyPI (e.g. tag retarget / re-run), guard sets
# already_published=true and publish jobs are skipped *before* any Environment wait —
# so canceling a duplicate run never paints the Deployments sidebar red.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: verify tag matches package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      already_published: ${{ steps.check.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: false
      - id: check
        name: Tag, __init__, CHANGELOG, and PyPI presence
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/pydiggs/__init__.py').read_text()).group(1))")"
          fi
          code="$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/pydiggs/__init__.py').read_text()).group(1))")"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag v$tag does not match __version__ $code"
            exit 1
          fi
          if ! grep -qE "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no released section for $tag"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # HEAD is enough: PyPI JSON 200 means the version number is spent.
          if curl -sfI "https://pypi.org/pypi/pydiggs/${tag}/json" >/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pydiggs==${tag} already on PyPI — skipping republish (tag move / re-run)"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  already-published:
    name: already on PyPI
    needs: guard
    if: needs.guard.outputs.already_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report skip (success)
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          echo "pydiggs==${VERSION} is already on PyPI."
          echo "Skipping TestPyPI / smoke / PyPI / GitHub Release republish."
          echo "https://pypi.org/project/pydiggs/${VERSION}/"

  build:
    name: build distributions
    needs: guard
    if: needs.guard.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          uv build
      - name: Check and record digests
        run: |
          uv run --group audit twine check --strict dist/*
          uv run --group audit check-wheel-contents dist/*.whl
          sha256sum dist/* | tee dist-digests.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distributions
          path: |
            dist/
            dist-digests.txt
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    needs: [guard, build]
    if: >-
      needs.guard.outputs.already_published != 'true'
      && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pydiggs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: true

  smoke:
    name: install from TestPyPI
    needs: [guard, testpypi]
    if: needs.guard.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Install the published artifact and import it
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --system \
                 --index-strategy unsafe-best-match \
                 --extra-index-url https://test.pypi.org/simple/ \
                 "pydiggs==${VERSION}"; then
              break
            fi
            echo "index not ready yet (attempt $attempt); waiting"
            sleep 20
          done
          python -c "import pydiggs as m; assert m.__version__ == '${VERSION}', m.__version__; print('smoke ok', m.__version__)"

  pypi:
    name: publish to PyPI
    needs: [guard, build, smoke]
    if: needs.guard.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pydiggs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          attestations: true

  github-release:
    name: GitHub release
    needs: [guard, pypi]
    if: needs.guard.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
      - name: Sign the distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          printf '\n---\nPyPI: https://pypi.org/project/pydiggs/%s/\n' "$VERSION" >> notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets only"
            gh release upload "$GITHUB_REF_NAME" dist/* dist-digests.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "pydiggs $VERSION" \
              --notes-file notes.md \
              --verify-tag \
              dist/* dist-digests.txt
          fi
