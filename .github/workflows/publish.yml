# Trusted Publishing (OIDC) — no API token.
# Filename stays `publish.yml` so the existing PyPI pending/active publisher keeps working:
#   owner: xinp-hub  repo: pydiggs  workflow: publish.yml  environment: pypi
# Mirror that publisher on test.pypi.org with environment: testpypi.
# Add required reviewers on the GitHub `pypi` Environment (optional on `testpypi`).
#
# Release path (FORGE): guard → build → TestPyPI → smoke → PyPI → Sigstore + GitHub Release.
# After PyPI, `container` builds the image from the published wheel and pushes it to
# ghcr.io/xinp-hub/pydiggs (tags X.Y.Z and X.Y, never latest), attested and scanned.
# `setup-uv` uses enable-cache: false on purpose (cache poisoning ↔ publish path).
#
# If the tag version is already on PyPI (e.g. tag retarget / re-run), guard sets
# already_published=true and publish jobs are skipped *before* any Environment wait —
# so canceling a duplicate run never paints the Deployments sidebar red.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: verify tag matches package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      already_published: ${{ steps.check.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.11"
          enable-cache: false
      - id: check
        name: Tag, __init__, CHANGELOG, and PyPI presence
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/pydiggs/__init__.py').read_text()).group(1))")"
          fi
          code="$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/pydiggs/__init__.py').read_text()).group(1))")"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag v$tag does not match __version__ $code"
            exit 1
          fi
          if ! grep -qE "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no released section for $tag"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # HEAD is enough: PyPI JSON 200 means the version number is spent.
          if curl -sfI "https://pypi.org/pypi/pydiggs/${tag}/json" >/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pydiggs==${tag} already on PyPI — skipping republish (tag move / re-run)"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  already-published:
    name: already on PyPI
    needs: guard
    if: needs.guard.outputs.already_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report skip (success)
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          echo "pydiggs==${VERSION} is already on PyPI."
          echo "Skipping TestPyPI / smoke / PyPI / GitHub Release republish."
          echo "https://pypi.org/project/pydiggs/${VERSION}/"

  build:
    name: build distributions
    needs: guard
    if: needs.guard.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          uv build
      - name: Check and record digests
        run: |
          uv run --group audit twine check --strict dist/*
          uv run --group audit check-wheel-contents dist/*.whl
          sha256sum dist/* | tee dist-digests.txt
      # The tested dependency set for pip users (pass it with -c): the runtime and every
      # extra from uv.lock, without dev groups or hashes. Outside dist/, so the PyPI
      # upload never sees it; github-release signs and attaches it.
      - name: Export constraints-X.Y.Z.txt from uv.lock
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir constraints
          uv export --frozen --all-extras --no-dev --no-hashes --no-emit-project \
            --output-file "constraints/constraints-${VERSION}.txt"
          cat "constraints/constraints-${VERSION}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: distributions
          path: |
            dist/
            dist-digests.txt
            constraints/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    needs: [guard, build]
    if: >-
      needs.guard.outputs.already_published != 'true'
      && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pydiggs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: distributions
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: true

  smoke:
    name: install from TestPyPI
    needs: [guard, testpypi]
    if: needs.guard.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # setup-uv installs a uv-managed Python, not a system one: install into the
      # activated virtual environment it creates, never with --system.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
      - name: Install the published artifact and import it
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          # Only pydiggs comes from TestPyPI (anyone can upload there); its
          # dependencies come from PyPI, so a squatted name cannot run here.
          installed=false
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --no-deps \
                 --index-url https://test.pypi.org/simple/ \
                 "pydiggs==${VERSION}"; then
              installed=true
              break
            fi
            echo "install failed (attempt $attempt; TestPyPI may still be indexing); retrying"
            sleep 20
          done
          "$installed"
          python -c "from importlib.metadata import requires; print('\n'.join(r for r in requires('pydiggs') or [] if 'extra ==' not in r))" > deps.txt
          uv pip install --index-url https://pypi.org/simple/ -r deps.txt
          python -c "import pydiggs as m; assert m.__version__ == '${VERSION}', m.__version__; print('smoke ok', m.__version__)"

  pypi:
    name: publish to PyPI
    needs: [guard, build, smoke]
    if: needs.guard.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pydiggs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: distributions
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          attestations: true

  github-release:
    name: GitHub release
    needs: [guard, pypi]
    if: needs.guard.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: distributions
      - name: Sign the distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl ./constraints/constraints-*.txt
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          printf '\n---\nPyPI: https://pypi.org/project/pydiggs/%s/\n' "$VERSION" >> notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets only"
            gh release upload "$GITHUB_REF_NAME" dist/* constraints/* dist-digests.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "pydiggs $VERSION" \
              --notes-file notes.md \
              --verify-tag \
              dist/* constraints/* dist-digests.txt
          fi

  # The container image (docs/container.md, brief D13), built only from the wheel this
  # run published: downloaded from PyPI and checked against both the PyPI JSON API and
  # this run's dist-digests.txt before it enters the build. Pushed by digest only as a
  # multi-arch index with SLSA provenance (mode=max) and an SBOM, attested to the
  # registry and scanned; only then do the X.Y.Z and X.Y tags point at it. No registry
  # token: github.token only. Tag pushes only, so the signing identity is always
  # publish.yml@refs/tags/vX.Y.Z.
  # Recovering a failed image push: use "Re-run failed jobs". A full re-run finds the
  # release on PyPI (already_published=true) and skips this job.
  container:
    name: container image (GHCR)
    needs: [guard, build, pypi]
    if: needs.guard.outputs.already_published != 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/xinp-hub/pydiggs
      # As in ci.yml's container-build job; bump both together.
      TRIVY_VERSION: "0.76.0"
      TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: distributions
          path: ${{ runner.temp }}/built
      - name: Download the release wheel from PyPI and verify its sha256
        id: wheel
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch_release_wheel.py "$VERSION" \
            "$RUNNER_TEMP/built/dist-digests.txt" dist
          ls -l dist
          sha="$(awk -v f="dist/pydiggs-${VERSION}-py3-none-any.whl" '$2 == f {print $1}' \
            "$RUNNER_TEMP/built/dist-digests.txt")"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      # The images these actions and BuildKit run are pinned by index digest too (they
      # build and attest the image) and bumped by hand under the 14-day rule:
      # binfmt qemu-v10.2.3 (2026-06-08), BuildKit v0.34.1 (2026-10-20),
      # buildkit-syft-scanner 1.12.0 (2026-08-13). No binfmt image cache on this path.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.guard.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.guard.outputs.version }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND MPL-2.0 AND MIT
            org.opencontainers.image.documentation=https://xinp-hub.github.io/pydiggs/container/
          annotations: |
            org.opencontainers.image.licenses=Apache-2.0 AND MPL-2.0 AND MIT
      - name: Build and push by digest, untagged (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
            REVISION=${{ github.sha }}
            WHEEL_SHA256=${{ steps.wheel.outputs.sha256 }}
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - name: Attest the pushed image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organisation-owned repositories.
          create-storage-record: false
      - name: Install Trivy (checksum-verified)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version
      - name: Scan the pushed digest on both platforms (fail on fixable HIGH/CRITICAL)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$IMAGE@$DIGEST ($platform)"
            "$RUNNER_TEMP/trivy" image --platform "$platform" --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              "$IMAGE@$DIGEST"
            echo "::endgroup::"
          done
      - name: Tag the scanned digest X.Y.Z and X.Y
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
            got="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}')"
            [ "$got" = "\"$DIGEST\"" ] || { echo "$tag is $got, expected $DIGEST" >&2; exit 1; }
          done <<< "$TAGS"
          {
            echo "### Container image"
            echo
            echo "$IMAGE@$DIGEST"
            echo
            echo "Verify: gh attestation verify oci://$IMAGE@$DIGEST --repo xinp-hub/pydiggs" \
              "--signer-workflow xinp-hub/pydiggs/.github/workflows/publish.yml" \
              "--source-ref refs/tags/v$VERSION --deny-self-hosted-runners"
          } >> "$GITHUB_STEP_SUMMARY"
