# Publish with PyPI Trusted Publishing (OIDC). No API token in this workflow.
#
# One-time setup on https://pypi.org/manage/project/pydiggs/settings/publishing/:
#   Owner: xinp-hub
#   Repository: pydiggs
#   Workflow: publish.yml
#   Environment: pypi
#
# Create a GitHub Environment named `pypi` (optional required reviewers = human gate).
# After Trusted Publishing is linked, remove any legacy PYPI_TOKEN repository secrets.
name: Publish to PyPI

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pydiggs/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          poetry build

      - name: Record digests
        run: sha256sum dist/* | tee dist-digests.txt

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          attestations: true
