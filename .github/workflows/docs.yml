Publishes the documentation site in two versions:
#
#   latest/  the newest release tag vX.Y.Z, built from that tag's own files and uv.lock
#   dev/     the default branch: unreleased code, and every page says so
#
# The site root redirects to latest/ (to dev/ until the first release), and versions.json
# feeds the version switcher. Older releases are not kept: every run replaces the whole site.
#
# No job here can write to the repository. The site travels as a Pages artifact and is
# deployed with OIDC, so there is no gh-pages branch and no `contents: write` (which is why
# this is not `mike deploy`). scripts/docs_site.py holds the assembly logic.
#
# Setup (once): Settings > Pages > Source "GitHub Actions"; and let the `github-pages`
# environment deploy from tags `v*` as well as the default branch.
name: Deploy Documentation

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Fail if a uv.lock is out of date rather than silently resolving something new.
  UV_FROZEN: "1"
  # uv uses only its own python-build-standalone interpreters, never the runner image's
  # distro Python, so every job runs the same build.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    name: build dev and latest
    # GitHub-hosted on purpose, like release.yml: what is published is built there only.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    outputs:
      newest: ${{ steps.tag.outputs.version }}
      built: ${{ steps.latest.outputs.built }}
    steps:
      # Always the default branch, whatever triggered the run: a tag push or a manual run
      # from another branch must not publish that ref as `dev`.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: dev
          fetch-depth: 0
          persist-credentials: false
      # No cache on the publish path: a poisoned cache entry would ship to Pages.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Find the newest release tag
        id: tag
        working-directory: dev
        run: python3 scripts/docs_site.py latest-tag >> "$GITHUB_OUTPUT"
      - name: Check out the newest release
        if: steps.tag.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      # The video tutorials (docs/tutorials/*.yml; format in tools/tutorials/README.md). VHS records
      # the terminal with the runner's Chrome, ttyd serves it, ffmpeg encodes. Static
      # binaries, each pinned by sha256, into a directory on PATH: no root, no apt.
      - name: Install the tutorial renderer
        env:
          VHS_URL: https://github.com/charmbracelet/vhs/releases/download/v0.12.1/vhs_0.12.1_Linux_x86_64.tar.gz
          VHS_SHA256: eb33787a5b1cebf91fe0b18bd231e2d71d36c1ff4babd99ddac1a6ab411efd10
          TTYD_URL: https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55
          FFMPEG_URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64
          FFMPEG_SHA256: e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99
          FFPROBE_URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64
          FFPROBE_SHA256: 4f231a1960d83e403d08f7971e271707bec278a9ae18e21b8b5b03186668450d
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/tutorial-bin"
          mkdir -p "$bin"
          fetch() {
            curl --fail --silent --show-error --location --output "$2" "$1"
            echo "$3  $2" | sha256sum --check --strict
          }
          fetch "$VHS_URL" "$RUNNER_TEMP/vhs.tar.gz" "$VHS_SHA256"
          tar -xzf "$RUNNER_TEMP/vhs.tar.gz" -C "$RUNNER_TEMP"
          find "$RUNNER_TEMP" -maxdepth 2 -type f -name vhs -exec mv {} "$bin/vhs" \;
          fetch "$TTYD_URL" "$bin/ttyd" "$TTYD_SHA256"
          fetch "$FFMPEG_URL" "$bin/ffmpeg" "$FFMPEG_SHA256"
          fetch "$FFPROBE_URL" "$bin/ffprobe" "$FFPROBE_SHA256"
          chmod +x "$bin"/*
          echo "$bin" >> "$GITHUB_PATH"
      # Rendered into each checkout's build/tutorials/, where the mkdocs hook finds them. The
      # renderer has its own locked environment (tools/tutorials/build.py.lock); the
      # checkout's .venv/bin goes first on PATH, so the videos run that checkout's pydiggs.
      # The dev tutorials must render: a failed expect is a broken feature or a stale
      # tutorial. A release tag from before tutorials existed has none and builds without.
      - name: Render the tutorials
        env:
          HAS_RELEASE: ${{ steps.tag.outputs.tag }}
          TUTORIALS_CHROME_CHANNEL: chrome
        run: |
          set -euo pipefail
          render() {
            (cd "$1" && uv sync --group docs --group dev &&
              TUTORIALS_PACKAGE_VERSION="$(.venv/bin/python -c 'import pydiggs; print(pydiggs.__version__)')" \
              PATH="$PWD/.venv/bin:$PATH" \
              uv run --locked --script tools/tutorials/build.py --out build/tutorials)
          }
          render dev
          if [ -n "$HAS_RELEASE" ] && [ -f release/tools/tutorials/build.py ]; then
            render release ||
              echo "::warning title=Release tutorials were not rendered::latest/ is published with transcripts only."
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        id: pages
      - name: Build dev (strict, a broken link fails the build)
        working-directory: dev
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/dev/
          # A page that embeds a tutorial whose video was not rendered fails the build.
          TUTORIALS_REQUIRE: "1"
        run: |
          uv sync --group docs --group dev
          uv run --group docs mkdocs build --strict --site-dir "$RUNNER_TEMP/site/dev"
      # A tag from before this workflow may not build. That must not take the site down:
      # publish dev alone and say so. A new release that does not build is caught by the
      # `verify` job, which expects the version that was just tagged.
      - name: Build latest from the release tag
        id: latest
        if: steps.tag.outputs.tag != ''
        working-directory: release
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/latest/
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if uv sync --group docs --group dev &&
            uv run --group docs mkdocs build --strict --site-dir "$RUNNER_TEMP/site/latest"; then
            echo "built=$VERSION" >> "$GITHUB_OUTPUT"
          else
            rm -rf "$RUNNER_TEMP/site/latest"
            echo "::warning title=Release docs were not built::The docs of $TAG do not build, so the site is published with dev only."
          fi
      # Also the redirect stubs at every page's unversioned address (/http-api/ leads to
      # latest/http-api/) and the root 404.html, which needs the site's base path.
      - name: Write versions.json and the redirects
        working-directory: dev
        env:
          BUILT: ${{ steps.latest.outputs.built }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          python3 scripts/docs_site.py assemble --site "$RUNNER_TEMP/site" --latest "$BUILT"
          --base-url "$BASE_URL/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # A green deploy only says the upload was accepted. This reads the public site the way a
  # reader does. It holds no token and checks out nothing, so a failed run can simply be
  # re-run. GitHub Pages lets its CDN serve a page for up to ten minutes (Cache-Control:
  # max-age=600) and may ignore the query string, so a page replaced by this deploy can
  # stay old for that long: the check keeps trying for fifteen minutes, and each attempt
  # says what it is still waiting for.
  verify:
    name: verify the live site
    needs: [build, deploy]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: The site serves what was just published
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
          RELEASED: ${{ github.ref_type == 'tag' && needs.build.outputs.newest || '' }}
          BUILT: ${{ needs.build.outputs.built }}
        run: |
          set -euo pipefail
          site="${SITE%/}"
          get() { curl --fail --silent --show-error --location --max-time 30 "$1?run=$GITHUB_RUN_ID"; }
          lists() {
            get "$site/versions.json" |
              jq -e --arg v "$1" 'any(.[]; .version == $v and (.aliases | index("latest") != null))' > /dev/null
          }
          # Prints what is not live yet; prints nothing when everything is.
          # grep reads the whole page (no -q): with pipefail, grep -q stopping early can
          # fail the pipeline on a page larger than the pipe buffer although it matched.
          missing() {
            get "$site/dev/" > /dev/null || { echo "dev/"; return; }
            get "$site/schemas/diggs-findings-1.2.schema.json" | jq -e '."$id"' > /dev/null ||
              { echo "schemas/ at the site root"; return; }
            get "$site/versions.json" | jq -e 'any(.[]; .version == "dev")' > /dev/null ||
              { echo "dev in versions.json"; return; }
            # pyDIGGS emits unversioned addresses (problem types, the SARIF helpUri).
            get "$site/http-api/" | grep -F 'http-api/" + location.search + location.hash' > /dev/null ||
              { echo "the redirect at the unversioned http-api/"; return; }
            if [ -n "$BUILT" ]; then
              lists "$BUILT" || { echo "$BUILT as latest in versions.json"; return; }
            fi
            if [ -n "$RELEASED" ]; then
              lists "$RELEASED" || { echo "$RELEASED as latest in versions.json"; return; }
              get "$site/latest/" |
                grep -F "<meta name=\"package-version\" content=\"$RELEASED\">" > /dev/null ||
                { echo "the $RELEASED version tag on latest/"; return; }
            fi
          }
          waiting=""
          for attempt in $(seq 1 60); do
            waiting="$(missing)"
            if [ -z "$waiting" ]; then
              echo "Verified $site (dev${BUILT:+, latest = $BUILT})."
              exit 0
            fi
            echo "Attempt $attempt: waiting for $waiting."
            sleep 15
          done
          echo "::error title=The live docs are not what was published::After 15 minutes $site still does not serve $waiting."
          exit 1
