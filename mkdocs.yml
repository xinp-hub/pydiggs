site_name: pyDIGGS
site_description: Offline validation for DIGGS geotechnical and geoenvironmental XML, from the command line, Python, web, desktop, AI assistants and the browser.
site_author: Xin Peng
site_url: https://xinp-hub.github.io/pydiggs/
repo_url: https://github.com/xinp-hub/pydiggs
repo_name: xinp-hub/pydiggs
edit_uri: edit/master/docs/
copyright: >-
  Copyright &copy; 2021&ndash;2026 Xin Peng (project lead) &middot; Contributor: Asitha
  Senanayake &middot; Apache-2.0

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    # Follows the operating system until the reader picks a scheme.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
  - autorefs

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xinp-hub/pydiggs
      name: pyDIGGS on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pydiggs/
      name: pyDIGGS on PyPI
    - icon: material/rss
      link: https://github.com/xinp-hub/pydiggs/releases.atom
      name: pyDIGGS releases feed
  generator: false
  # Buttondown username for the "Stay updated" sign-up form; empty shows a note instead.
  newsletter:
    buttondown: "pydiggs"

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Get started:
    - Installation: installation.md
    - Quickstart: quickstart.md
  - Guides:
    - Validation checks: usage.md
    - Findings (JSON / SARIF): findings.md
    - Reading files: model.md
    - Capabilities: capabilities.md
  - Integrate:
    - integrations.md
    - HTTP API: http-api.md
    - Container image: container.md
    - Stdio sidecar (native apps): sidecar.md
    - Host integration: sidecar-hosts.md
    - MCP server (AI assistants): mcp.md
    - Browser (Pyodide): browser.md
    - JavaScript and TypeScript: javascript.md
  - Reference:
    - Python API: reference.md
  - Project:
    - Contributing: contributing.md
    - Authors: authors.md
    - Licence and use: license.md
    - History: history.md
    - Stay updated: stay-updated.md
    - Security policy: https://github.com/xinp-hub/pydiggs/security/policy
